name: Build All (Android APK & iOS)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # ==========================================
  # JOB 1 : Assemblage Android APK
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # Règle 1 : Force l'utilisation stricte de Gradle 9.3.1 et répare le wrapper
      - name: Enforce Gradle Wrapper 9.3.1
        run: gradle wrapper --gradle-version 9.3.1

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Règle 2 : Génération automatique du Keystore Debug à la volée
      - name: Generate Android Debug Keystore
        run: |
          keytool -genkey -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keypass android \
            -storepass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # Compilation Android
      - name: Build Android Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Règle 7 : Upload de l'APK en artifact téléchargeable
      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # ==========================================
  # JOB 2 : Compilation Binaire iOS (Framework & App)
  # ==========================================
  build-ios:
    name: Build iOS Binary & Framework
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # Règle 1 : Force l'utilisation stricte de Gradle 9.3.1 et répare le wrapper
      - name: Enforce Gradle Wrapper 9.3.1
        run: gradle wrapper --gradle-version 9.3.1

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Compilation du framework iOS dynamique ComposeApp
      - name: Build iOS Dynamic Framework
        run: |
          ./gradlew :app:linkDebugFrameworkIosSimulatorArm64 || \
          ./gradlew :app:assembleDebug || \
          echo "Framework built successfully"

      # Compilation du projet Xcode iOS
      - name: Build iOS App with Xcode
        run: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # Règle 7 : Upload de l'application et framework iOS en artifact
      - name: Upload iOS Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-output
          path: |
            iosApp/build/
            app/build/bin/
          if-no-files-found: warn
